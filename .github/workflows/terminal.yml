name: Regenerar terminal

on:
  schedule:
    - cron: "17 6 * * *"   # todos los días, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["profile.toml", "scripts/**", "assets/fonts/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar SVGs
        run: python scripts/generate.py
        env:
          # PROFILE_TOKEN (opcional) suma las contribuciones privadas; si no existe, alcanza el del Action.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit si cambió algo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/perfil-*.svg
          git diff --cached --quiet || (git commit -m "chore: regenerar terminal" && git push)
